services:
  - type: web
    name: fampay-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: fampay-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fampay-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fampay-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: fampay-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: fampay-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: fampay-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: ADMIN_PASSWORD
        value: kankan201028
      - key: APP_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: ORDER_EXPIRY_MINUTES
        value: "15"
      - key: APP_URL
        sync: false

databases:
  - name: fampay-db
    plan: free
    region: singapore
    databaseName: fampay
    user: fampay_user
