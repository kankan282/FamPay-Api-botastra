<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
    ServerName localhost

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    # -----------------------------------------------------------------
    # Rewrites (duplicated from .htaccess so the deployment also works
    # when the hidden .htaccess file is not uploaded to the repository)
    # -----------------------------------------------------------------
    <IfModule mod_rewrite.c>
        RewriteEngine On

        # Hidden admin panel: /cpanel-admin-2025 -> cpanel-admin-2025.php
        RewriteRule ^/cpanel-admin-2025/?$ /cpanel-admin-2025.php [L,QSA]

        # Extension-less API routes: /qr -> qr.php, /verify -> verify.php ...
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^/(qr|verify|login|create-key|test-db|test-imap|test-qr|test-all)/?$ /$1.php [L,QSA]
    </IfModule>

    # -----------------------------------------------------------------
    # Protect sensitive files
    # -----------------------------------------------------------------
    <FilesMatch "^(config\.php|composer\.(json|lock)|render\.yaml|Dockerfile|apache-config\.conf|docker-entrypoint\.sh|.*\.md|.*\.sql|.*\.log)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^\.(env|env\..*|htaccess|gitignore)$">
        Require all denied
    </FilesMatch>

    # Never expose the dependency tree, migrations or dev tools over HTTP
    <Directory /var/www/html/vendor>
        Require all denied
    </Directory>
    <Directory /var/www/html/migrations>
        Require all denied
    </Directory>
    <Directory /var/www/html/tests>
        Require all denied
    </Directory>

    # Directory listings off
    <Directory /var/www/html>
        Options -Indexes
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json
    </IfModule>
</VirtualHost>
